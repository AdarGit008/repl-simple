name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One in-flight run per branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report every leg: @pydantic/monty ships per-platform native binaries,
      # so one failing leg says nothing about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The bridged find/grep tools shell out to fd and rg. The suite no longer
      # downloads them — test/support/bridge-tools.ts sets PI_OFFLINE=1, so
      # pi's ensureTool() never reaches api.github.com mid-run (#91). Install
      # them here so CI exercises the real integration rather than skipping it.
      - name: Install fd and ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y fd-find ripgrep

      - name: Install fd and ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install fd ripgrep

      - run: npm ci

      - run: npm run check

      # REQUIRE_BRIDGE_TOOLS=1 turns the local "skip if absent" behaviour into a
      # hard failure. Without it, a broken install step above would silently
      # drop the find/grep tests and CI would still be green — the exact
      # "green means nothing" failure bucket 1 exists to eliminate.
      - run: npm test
        env:
          REQUIRE_BRIDGE_TOOLS: "1"
